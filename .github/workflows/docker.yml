# Builds the container, checks that it reproduces Google Earth Engine, then publishes it to the GitHub
# container registry:
#   push to main (code, container or test changes)  ->  ghcr.io/<owner>/s1-gee-parity:main
#   version tag (v0.1.1, ...)                       ->  ghcr.io/<owner>/s1-gee-parity:<tag>
# It can also be started by hand from the Actions tab. After the first successful run, set the package
# visibility to "public" in the GitHub package settings so the openEO backend can pull the image without
# credentials.
name: Build, test and publish container

on:
  push:
    branches: [main]
    paths: ["cwl/**", "scripts/**", "tests/**", ".github/workflows/**"]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    env:
      VITO_USER: ${{ secrets.VITO_REGISTRY_USER }}    # empty unless the secret is set
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space for the SNAP image and one test scene
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android

      # A plain single-platform image: without --provenance=false the build adds an attestation entry
      # ("unknown/unknown" platform), which the published image of 16 Nov 2026 had and which
      # cloudinsar's images, known to run on the openEO cluster, do not have.
      - name: Build image
        run: docker build --provenance=false --sbom=false -t s1-gee-parity -f cwl/Dockerfile .

      - name: Parity test against Google Earth Engine reference pixels
        run: docker run --rm --entrypoint python3 s1-gee-parity /opt/s1gee/tests/test_parity.py

      - name: Publish
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          TAG="${GITHUB_REF_NAME//\//-}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag s1-gee-parity "ghcr.io/$OWNER/s1-gee-parity:$TAG"
          docker push "ghcr.io/$OWNER/s1-gee-parity:$TAG"
          echo "published ghcr.io/$OWNER/s1-gee-parity:$TAG" >> "$GITHUB_STEP_SUMMARY"
          docker image ls s1-gee-parity >> "$GITHUB_STEP_SUMMARY"
          docker buildx imagetools inspect "ghcr.io/$OWNER/s1-gee-parity:$TAG" | tee -a "$GITHUB_STEP_SUMMARY"

      # The CDSE openEO cluster does not pull images from public registries (ghcr.io, Docker Hub); the backend's
      # own CWL example uses VITO's Artifactory. Runs only when the repository has the secrets
      # VITO_REGISTRY_USER and VITO_REGISTRY_TOKEN (an Artifactory identity token with deploy rights);
      # VITO_REGISTRY_IMAGE (a repository variable) overrides the target.
      - name: Publish to VITO Artifactory
        env:
          VITO_TOKEN: ${{ secrets.VITO_REGISTRY_TOKEN }}
          VITO_IMAGE: ${{ vars.VITO_REGISTRY_IMAGE || 'openeo-docker-local-prod.repo.vito.be/s1-gee-parity' }}
        if: ${{ env.VITO_USER != '' }}
        run: |
          TAG="${GITHUB_REF_NAME//\//-}"
          echo "$VITO_TOKEN" | docker login "${VITO_IMAGE%%/*}" -u "$VITO_USER" --password-stdin
          docker tag s1-gee-parity "$VITO_IMAGE:$TAG"
          docker push "$VITO_IMAGE:$TAG"
          echo "published $VITO_IMAGE:$TAG" >> "$GITHUB_STEP_SUMMARY"
